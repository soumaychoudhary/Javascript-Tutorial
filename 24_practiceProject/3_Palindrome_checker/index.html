<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Page description" />
  <title>Palindrome Checker</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Is it a Palindrome?</h1>
  <div class="container">
    

    <div class="card">
      <p>Enter in text to check for a palindrome:</p>
      <input type="text" id="text-input" placeholder="Enter a valid string"  > &nbsp;&nbsp;
      <button id="check-btn">check</button>
      <p id="result">result of palindrome</p>
    </div>

    <div class="description">
      <p>A palindrome is a word or sentence that's spelled the same way both forward and backward, ignoring punctuation, case, and spacing.</p>
    </div>
    

  </div>

  <script src="script.js"></script>
</body>
</html>
